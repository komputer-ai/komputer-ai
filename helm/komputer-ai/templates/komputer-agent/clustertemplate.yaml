apiVersion: komputer.komputer.ai/v1alpha1
kind: KomputerAgentClusterTemplate
metadata:
  name: default
  labels:
    {{- include "komputer.labels" . | nindent 4 }}
spec:
  podSpec:
    {{- with (include "komputer.agent.serviceAccountName" .) }}
    serviceAccountName: {{ . }}
    {{- end }}
    securityContext:
      {{- toYaml .Values.agent.podSecurityContext | nindent 6 }}
    {{- with .Values.imagePullSecrets }}
    imagePullSecrets:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    containers:
    - name: agent
      image: {{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}
      imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
      {{- if or .Values.bedrock.enabled .Values.vertex.enabled .Values.metrics.perAgentLabels .Values.metrics.agent.remoteWrite.enabled }}
      env:
      {{- if .Values.bedrock.enabled }}
      - name: CLAUDE_CODE_USE_BEDROCK
        value: "1"
      - name: AWS_REGION
        value: {{ .Values.bedrock.region | quote }}
      {{- end }}
      {{- if .Values.vertex.enabled }}
      - name: CLAUDE_CODE_USE_VERTEX
        value: "1"
      - name: ANTHROPIC_VERTEX_PROJECT_ID
        value: {{ .Values.vertex.projectId | quote }}
      - name: CLOUD_ML_REGION
        value: {{ .Values.vertex.region | quote }}
      {{- end }}
      {{- if .Values.metrics.perAgentLabels }}
      - name: KOMPUTER_METRICS_PER_AGENT
        value: "true"
      {{- end }}
      {{- if .Values.metrics.agent.remoteWrite.enabled }}
      - name: KOMPUTER_METRICS_REMOTE_WRITE_URL
        value: {{ .Values.metrics.agent.remoteWrite.url | quote }}
      {{- if .Values.metrics.agent.remoteWrite.intervalSeconds }}
      - name: KOMPUTER_METRICS_REMOTE_WRITE_INTERVAL
        value: {{ .Values.metrics.agent.remoteWrite.intervalSeconds | quote }}
      {{- end }}
      {{- if .Values.metrics.agent.remoteWrite.bearerTokenSecret }}
      - name: KOMPUTER_METRICS_REMOTE_WRITE_TOKEN
        valueFrom:
          secretKeyRef:
            name: {{ .Values.metrics.agent.remoteWrite.bearerTokenSecret }}
            key: token
      {{- end }}
      {{- end }}
      {{- end }}
      {{- with .Values.clusterTemplate.resources }}
      resources:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  storage:
    size: {{ .Values.clusterTemplate.storageSize }}
  {{- if not (or .Values.bedrock.enabled .Values.vertex.enabled) }}
  anthropicKeySecretRef:
    name: {{ .Values.anthropicKeySecret.name }}
    key: {{ .Values.anthropicKeySecret.key }}
    {{- if .Values.anthropicKeySecret.namespace }}
    namespace: {{ .Values.anthropicKeySecret.namespace }}
    {{- end }}
  {{- end }}
