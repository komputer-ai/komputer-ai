---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
    argocd.argoproj.io/sync-wave: "-1"
    controller-gen.kubebuilder.io/version: v0.18.0
  name: komputerconfigs.komputer.komputer.ai
spec:
  group: komputer.komputer.ai
  names:
    kind: KomputerConfig
    listKind: KomputerConfigList
    plural: komputerconfigs
    singular: komputerconfig
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: KomputerConfig is the cluster-scoped singleton configuration
          for the komputer.ai platform.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: KomputerConfigSpec defines the desired state of KomputerConfig.
            properties:
              apiURL:
                default: http://komputer-api.default.svc.cluster.local:8080
                description: |-
                  APIURL is the internal URL of the komputer-api service.
                  Used by manager agents to create/manage sub-agents.
                type: string
              redis:
                description: Redis defines the Redis connection settings for agent
                  event streaming.
                properties:
                  address:
                    description: Address is the Redis host:port.
                    type: string
                  db:
                    default: 0
                    description: DB is the Redis database number.
                    type: integer
                  passwordSecret:
                    description: PasswordSecret references a Kubernetes Secret containing
                      the Redis password.
                    properties:
                      key:
                        description: Key within the Secret.
                        type: string
                      name:
                        description: Name of the Secret.
                        type: string
                      namespace:
                        description: |-
                          Namespace is the namespace of the source Secret. If empty, defaults
                          to the operator's namespace (the namespace komputer-system was
                          deployed into).
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  streamPrefix:
                    default: komputer-events
                    description: StreamPrefix is the Redis stream key prefix for agent
                      events.
                    type: string
                required:
                - address
                type: object
              s3:
                description: |-
                  S3 configures the S3 session store, where agent sessions are saved and
                  restored from. Unset means the session store is off.
                properties:
                  bucket:
                    description: Bucket holds the agents' session objects.
                    type: string
                  credentialsSecret:
                    description: |-
                      CredentialsSecret holds static credentials under the keys
                      AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY. When unset, everything uses
                      the AWS default credential chain (IAM roles, or env vars you add).
                    properties:
                      name:
                        description: Name of the Secret.
                        type: string
                      namespace:
                        description: Namespace of the Secret. Empty means the operator's
                          namespace.
                        type: string
                    required:
                    - name
                    type: object
                  enabled:
                    description: Enabled turns the session store on.
                    type: boolean
                  endpoint:
                    description: Endpoint is the S3 API URL for non-AWS stores. Empty
                      means AWS.
                    type: string
                  forcePathStyle:
                    description: ForcePathStyle uses path-style addressing (most non-AWS
                      stores need it).
                    type: boolean
                  prefix:
                    description: Prefix is prepended to every object key.
                    type: string
                  region:
                    description: Region of the bucket.
                    type: string
                required:
                - bucket
                - enabled
                type: object
            required:
            - redis
            type: object
          status:
            description: KomputerConfigStatus defines the observed state of KomputerConfig.
            type: object
        type: object
    served: true
    storage: true
